name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: fmt, clippy, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veilproof
          POSTGRES_PASSWORD: veilproof
          POSTGRES_DB: veilproof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veilproof"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The crypto round-trip test needs no database; the store integration
      # tests use the Postgres service above.
      - name: Test
        run: cargo test
        env:
          DATABASE_URL: postgres://veilproof:veilproof@localhost:5432/veilproof

      - name: Build
        run: cargo build --release
