[package]
name = "veilproof-prover"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The veilproof proving path compiled to WebAssembly, so a holder's secret never has to leave their browser."

[lib]
crate-type = ["cdylib", "rlib"]

# Built on its own: the server's image and its lockfile should not carry this.
[workspace]

[dependencies]
# Only the crypto core, not the HTTP service or its database.
veilproof-server = { path = "..", default-features = false }
ark-bn254 = "0.5"
ark-std = "0.5"
rand = "0.8"
rand_chacha = "0.3"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# rand links getrandom, which refuses to build for wasm32-unknown-unknown without
# a backend. Nothing here draws from it: every seed comes in from the caller.
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
