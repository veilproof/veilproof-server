services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: veilproof
      POSTGRES_PASSWORD: veilproof
      POSTGRES_DB: veilproof
    ports:
      - "5432:5432"
    volumes:
      - veilproof-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veilproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://veilproof:veilproof@postgres:5432/veilproof
      VEILPROOF_BIND: 0.0.0.0:8080
      RUST_LOG: info,veilproof_server=debug
      # Trusted-setup keys produced by `veilproof-keygen`. Without this the
      # server falls back to the insecure deterministic dev setup.
      VEILPROOF_KEYS_DIR: /app/keys
      # Refuse to start unless those keys are the ones the on-chain circuit was
      # registered with. Without this the fallback above is silent: the server
      # comes up healthy and every proof it makes is rejected by the contract.
      # Print the expected value with `veilproof-vk <keys-dir>`.
      VEILPROOF_VK_SHA256: ${VEILPROOF_VK_SHA256:-}
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "8080:8080"

volumes:
  veilproof-pgdata:
