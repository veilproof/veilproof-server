[package]
name = "veilproof-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Backend service for veilproof: Merkle-tree management and Groth16 membership-proof generation for the veilproof-registry Soroban contract."

[lib]
name = "veilproof_server"
path = "src/lib.rs"

[[bin]]
name = "veilproof-server"
path = "src/main.rs"
required-features = ["server"]

[[bin]]
name = "veilproof-keygen"
path = "src/bin/keygen.rs"

[[bin]]
name = "veilproof-commit"
path = "src/bin/commit.rs"

[[bin]]
name = "veilproof-vk"
path = "src/bin/vk.rs"

[[test]]
name = "prove_limits"
required-features = ["server"]

[[test]]
name = "responsiveness"
required-features = ["server"]

[[test]]
name = "routes"
required-features = ["server"]

[[test]]
name = "store_integration"
required-features = ["server"]

# The HTTP service and its database. Without this feature the crate is just the
# crypto core and the Merkle tree, which is what prover/ compiles to WebAssembly.
[features]
default = ["server"]
server = [
    "dep:axum",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:sqlx",
    "dep:tokio",
    "dep:tower-http",
    "dep:tracing",
    "dep:tracing-subscriber",
]

[dependencies]
# --- ZK / crypto (the trust-critical core) ---
ark-bn254 = "0.5"
ark-ff = "0.5"
ark-ec = "0.5"
ark-groth16 = { version = "0.5", default-features = false }
ark-relations = "0.5"
ark-r1cs-std = { version = "0.5", default-features = false }
ark-snark = "0.5"
ark-serialize = "0.5"
ark-std = "0.5"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"

# --- API / runtime ---
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"], optional = true }
tower-http = { version = "0.6", features = ["trace", "cors"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# --- persistence ---
# tls-rustls: hosted Postgres (Neon, and most managed providers) refuses
# plaintext connections. rustls keeps the runtime image free of OpenSSL.
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"], optional = true }

# --- misc ---
# Fetching the trusted setup at boot; rustls so the runtime image needs no
# OpenSSL. Only the pieces required for a plain GET.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
hex = "0.4"
thiserror = "1"

[dev-dependencies]
hex-literal = "0.4"
# Driving the router directly in tests/routes.rs, without binding a port.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
